name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ssh-mcp-linux-x86_64
            archive_ext: tar.gz
            use_cross: false

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: ssh-mcp-linux-aarch64
            archive_ext: tar.gz
            use_cross: true

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ssh-mcp-macos-x86_64
            archive_ext: tar.gz
            use_cross: false

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ssh-mcp-macos-arm64
            archive_ext: tar.gz
            use_cross: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ssh-mcp-windows-x86_64
            archive_ext: zip
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Windows: Setup Strawberry Perl (provides full Perl with Locale::Maketext::Simple)
      - name: Setup Strawberry Perl (Windows)
        if: matrix.os == 'windows-latest'
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'
          distribution: strawberry

      # Windows: Disable assembly routines in openssl-src and remove Git Bash's minimal perl
      - name: Setup Windows Environment
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          echo "OPENSSL_NO_ASM=1" >> $GITHUB_ENV
          rm -f /usr/bin/perl.exe /usr/bin/perl 2>/dev/null || true

      # Linux: Host build dependencies
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest' && !matrix.use_cross
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      # Linux ARM64: Fast prebuilt cross installation
      - name: Install Cross for ARM64 Linux
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Build binary (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Build binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $env:PATH = "C:\Strawberry\perl\bin;C:\Strawberry\c\bin;" + $env:PATH
          cargo build --release --target ${{ matrix.target }}

      - name: Package release assets (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          BIN_DIR="target/${{ matrix.target }}/release"
          mkdir -p package
          cp "${BIN_DIR}/ssh-mcp" package/
          cp README.md LICENSE config.example.toml package/ 2>/dev/null || true
          cd package
          tar -czvf "../${{ matrix.artifact_name }}.${{ matrix.archive_ext }}" *
          cd ..

          # Direct standalone binary
          cp "${BIN_DIR}/ssh-mcp" "./${{ matrix.artifact_name }}"
          chmod +x "./${{ matrix.artifact_name }}"

          # Compute SHA-256 Checksums
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.artifact_name }}.${{ matrix.archive_ext }}" > "${{ matrix.artifact_name }}.${{ matrix.archive_ext }}.sha256"
            sha256sum "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact_name }}.${{ matrix.archive_ext }}" > "${{ matrix.artifact_name }}.${{ matrix.archive_ext }}.sha256"
            shasum -a 256 "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"
          fi

      - name: Package release assets (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          BIN_DIR="target/${{ matrix.target }}/release"
          mkdir -p package
          cp "${BIN_DIR}/ssh-mcp.exe" package/
          cp README.md LICENSE config.example.toml package/ 2>/dev/null || true
          cd package
          7z a "../${{ matrix.artifact_name }}.${{ matrix.archive_ext }}" *
          cd ..

          # Direct standalone executable (.exe)
          cp "${BIN_DIR}/ssh-mcp.exe" "./${{ matrix.artifact_name }}.exe"

          # Compute SHA-256 Checksums
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.artifact_name }}.${{ matrix.archive_ext }}" > "${{ matrix.artifact_name }}.${{ matrix.archive_ext }}.sha256"
            sha256sum "${{ matrix.artifact_name }}.exe" > "${{ matrix.artifact_name }}.exe.sha256"
          else
            shasum -a 256 "${{ matrix.artifact_name }}.${{ matrix.archive_ext }}" > "${{ matrix.artifact_name }}.${{ matrix.archive_ext }}.sha256"
            shasum -a 256 "${{ matrix.artifact_name }}.exe" > "${{ matrix.artifact_name }}.exe.sha256"
          fi

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.artifact_name }}*
          draft: false
          prerelease: false
          generate_release_notes: true
