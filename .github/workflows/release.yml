name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ssh-mcp-linux-x86_64
            archive_ext: tar.gz
            use_cross: false

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: ssh-mcp-linux-aarch64
            archive_ext: tar.gz
            use_cross: true

          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: ssh-mcp-macos-x86_64
            archive_ext: tar.gz
            use_cross: false

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ssh-mcp-macos-arm64
            archive_ext: tar.gz
            use_cross: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ssh-mcp-windows-x86_64
            archive_ext: zip
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest' && !matrix.use_cross
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Install Cross for ARM64 Linux
        if: matrix.use_cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package release archive (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          BIN_DIR="target/${{ matrix.target }}/release"
          mkdir -p package
          cp "${BIN_DIR}/ssh-mcp" package/
          cp README.md LICENSE config.example.toml package/ 2>/dev/null || true
          cd package
          tar -czvf "../${{ matrix.artifact_name }}.${{ matrix.archive_ext }}" *
          cd ..
          shasum -a 256 "${{ matrix.artifact_name }}.${{ matrix.archive_ext }}" > "${{ matrix.artifact_name }}.${{ matrix.archive_ext }}.sha256"

      - name: Package release archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          BIN_DIR="target/${{ matrix.target }}/release"
          mkdir -p package
          cp "${BIN_DIR}/ssh-mcp.exe" package/
          cp README.md config.example.toml package/ 2>/dev/null || true
          cd package
          7z a "../${{ matrix.artifact_name }}.${{ matrix.archive_ext }}" *
          cd ..
          sha256sum "${{ matrix.artifact_name }}.${{ matrix.archive_ext }}" > "${{ matrix.artifact_name }}.${{ matrix.archive_ext }}.sha256"

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
            ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
