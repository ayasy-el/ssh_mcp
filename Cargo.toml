[package]
name = "ssh-mcp"
version = "0.1.2"
edition = "2021"
authors = ["ayasy-el"]
description = "SSH & SFTP Model Context Protocol (MCP) server with TUI dashboard and command controls"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ayasy-el/ssh_mcp"

[dependencies]
# Async Runtime
tokio = { version = "1.43", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"

# HTTP Server for MCP (Streamable HTTP / SSE)
axum = { version = "0.8", features = ["tokio", "macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# TUI
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }

# Serialization & CLI
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }

# Security & Crypto
zeroize = { version = "1.8", features = ["derive"] }
sha2 = "0.11"
hex = "0.4"
regex = "1.11"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
anyhow = "1.0"
tracing = "0.1"
parking_lot = "0.12"
async-trait = "0.1"
uuid = { version = "1.11", features = ["v4"] }
shlex = "2.0"

# SSH Engine (Vendored OpenSSL for seamless portable builds across Linux, macOS, and Windows)
ssh2 = { version = "0.9.6", features = ["vendored-openssl"] }
